[workspace]
members = ["crates/*", "xtask"]
resolver = "3"
default-members = ["crates/emos"]

[workspace.package]
edition = "2024"
repository = "https://github.com/bxb100/emos"
readme = "README.md"
license = "MIT"

[workspace.dependencies]
# Workspace crates
emos-client = { path = "crates/emos-client" }
douban-client = { path = "crates/douban-client" }
tmdb-client = { path = "crates/tmdb-client" }
trakt-client = { path = "crates/trakt-client" }
emos-db = { path = "crates/emos-db" }
emos-http = { path = "crates/emos-http" }
emos-cache = { path = "crates/emos-cache" }

# External dependencies
reqwest = { version = "0.13", features = ["json", "cookies", "query", "form"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.16"
serde_path_to_error = "0.1"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
jiff = { version = "0.2", features = ["static"] }
base64 = "0.22"
hmac = "0.12"
sha1 = "0.10"
urlencoding = "2.1"
anyhow = "1.0"
rand = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
sqlx = { version = "0.8", features = [
  "runtime-tokio",
  "macros",
  "uuid",
  "sqlite",
  "migrate",
  "json",
] }
clap = { version = "4.5", features = ["derive"] }
futures-util = "0"

[workspace.lints.rust]
unknown_lints = "deny"
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
too_many_arguments = "allow"

[profile.release]
opt-level = "z"   # Optimize for size.
lto = true        # Enable Link Time Optimization
codegen-units = 1 # Reduce number of codegen units to increase optimizations.
panic = "abort"   # Abort on panic
strip = true      # Automatically strip symbols from the binary.
