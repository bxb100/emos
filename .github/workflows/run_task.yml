name: run_task.yml
on:
  workflow_dispatch:
    inputs:
      task_name:
        description: "Task name to run. Select all to run every non-interactive task."
        required: false
        type: choice
        options:
          - all
          - tmdb_scifi_media
          - trakt_auth
          - trakt_trending
          - watch_hot_video
  schedule:
    - cron: "0 20 * * *"

permissions:
  contents: write

env:
  EMOS_TOKEN: ${{ secrets.EMOS_TOKEN }}
  EMOS_API_URL: ${{ secrets.EMOS_API_URL }}
  TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
  BANGUMI_ACCESS_TOKEN: ${{ secrets.BANGUMI_ACCESS_TOKEN }}

jobs:
  run-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Run tmdb_scifi_media
        uses: ./.github/actions/task
        if: ${{ inputs.task_name == 'tmdb_scifi_media' || inputs.task_name == 'all' || inputs.task_name == '' }}
        with:
          binary_name: "emos"
          task_args: "tmdb_scifi_media"
          token: ${{ github.token }}

      - name: Run watch_hot_video
        uses: ./.github/actions/task
        if: ${{ inputs.task_name == 'watch_hot_video' || inputs.task_name == 'all' || inputs.task_name == '' }}
        with:
          binary_name: "emos"
          task_args: "watch_hot_video --douban_user_id ${{ secrets.DOUBAN_USER_ID }}"
          token: ${{ github.token }}

      - name: Run trakt_trending
        uses: ./.github/actions/task
        if: ${{ inputs.task_name == 'trakt_trending' || inputs.task_name == 'all' || inputs.task_name == '' }}
        with:
          binary_name: "emos"
          task_args: "trakt_trending"
          token: ${{ github.token }}

      - name: Authorize Trakt
        uses: ./.github/actions/task
        if: ${{ inputs.task_name == 'trakt_auth' }}
        with:
          binary_name: "emos"
          task_args: "trakt_auth"
          token: ${{ github.token }}

      - name: Upload json
        uses: ./.github/actions/upload
        if: ${{ inputs.task_name != 'trakt_auth' }}
        with:
          CLOUDFLARE_R2_ACCOUNTID: ${{ secrets.CLOUDFLARE_R2_ACCOUNTID }}
          CLOUDFLARE_R2_KEY: ${{ secrets.CLOUDFLARE_R2_KEY }}
          CLOUDFLARE_R2_SECRET: ${{ secrets.CLOUDFLARE_R2_SECRET }}

      - uses: bxb100/.github/.github/actions/commit@main
        with:
          message: "chore: auto update cache or covers"
